schema: spec-driven

context: |
  Tech stack: Next.js 16 (App Router), React 19, TypeScript, Tailwind CSS 4, Prisma 7.
  Architecture: Server-component routes with actions.ts; domain modules split into repository/use-case/logic/errors.
  Data: SQLite is the development source of truth; generated PostgreSQL schema is used in production.
  Testing: Vitest unit tests and Playwright E2E against a disposable seeded SQLite database.
  Style: ESLint with Next core-web-vitals + TypeScript; strict TypeScript; @/ path alias.

strict_tdd: true

testing:
  strict_tdd: true
  detected: "2026-08-04"
  test_runner:
    framework: Vitest
    command: npm test
  layers:
    unit: { available: true, tool: Vitest }
    integration: { available: false, tool: null }
    e2e: { available: true, tool: Playwright }
  coverage:
    available: false
    command: null
  quality:
    linter: { available: true, command: npm run lint }
    type_checker: { available: true, command: npx tsc --noEmit }
    formatter: { available: false, command: null }

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and module boundaries
    - Preserve monetary, quantity, stock, reversal, and public-token invariants in AGENTS.md
  verify:
    - Run npx tsc --noEmit, npm test, npm run build, and npm run e2e when applicable
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)
