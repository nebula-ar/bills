name: Deploy Bills to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.SUPABASE_CUTOVER_COMPLETE == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: bills-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify deploy started
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          message=$(printf '🚀 <b>Deploy iniciado</b>\n📦 <b>Repositorio:</b> %s\n🔖 <b>Commit:</b> <code>%s</code>' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA")

          curl --fail --silent --show-error \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=$message" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"

      - name: Pack release
        run: |
          tar \
            --exclude=.git \
            --exclude=.env \
            --exclude='*.db' \
            --exclude=node_modules \
            --exclude=release.tgz \
            -czf "$RUNNER_TEMP/release.tgz" .

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/known_hosts

      - name: Upload and activate immutable release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail

          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "mkdir -p /home/deployer/incoming"

          scp -P "$VPS_PORT" \
            "$RUNNER_TEMP/release.tgz" \
            "$VPS_USER@$VPS_HOST:/home/deployer/incoming/bills-${GITHUB_SHA}.tgz"

          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "sudo /usr/local/sbin/deploy-bills '$GITHUB_SHA'"

      - name: Notify deploy result
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$DEPLOY_STATUS" in
            success)
              title="✅ <b>Deploy exitoso</b>"
              ;;
            failure)
              title="❌ <b>Deploy fallido</b>"
              ;;
            cancelled)
              title="⛔ <b>Deploy cancelado</b>"
              ;;
            *)
              title="⚠️ <b>Deploy finalizado</b>"
              ;;
          esac

          message=$(printf '%s\n📦 <b>Repositorio:</b> %s\n🔗 <a href="%s">Ver ejecución en GitHub</a>' \
            "$title" "$GITHUB_REPOSITORY" "$RUN_URL")

          curl --fail --silent --show-error \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=$message" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"
