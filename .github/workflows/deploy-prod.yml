name: Deploy Bills to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify deploy started
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          message=$(printf '🚀 <b>Deploy iniciado</b>\n📦 <b>Repositorio:</b> %s\n🔖 <b>Commit:</b> <code>%s</code>' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA")

          curl --fail --silent --show-error \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=$message" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"

      - name: Pack release
        run: |
          tar \
            --exclude=.git \
            --exclude=.env \
            --exclude='*.db' \
            --exclude=node_modules \
            --exclude=release.tgz \
            -czf "$RUNNER_TEMP/release.tgz" .

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Build and activate release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail

          release="/opt/bills/releases/${GITHUB_SHA}"

          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$release'"

          scp -P "$VPS_PORT" \
            "$RUNNER_TEMP/release.tgz" \
            "$VPS_USER@$VPS_HOST:$release/release.tgz"

          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "bash -se" <<REMOTE
          set -euo pipefail

          release="$release"

          tar -xzf "\$release/release.tgz" -C "\$release"
          rm -f "\$release/release.tgz"

          cd "\$release"

          set -a
          . /etc/bills.env
          set +a

          npm config set fetch-retries 5
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 120000

          npm ci --include=dev
          npm run db:generate
          npx prisma migrate deploy
          npm run build

          ln -sfn "\$release" /opt/bills/current

          systemctl restart bills.service
          systemctl is-active --quiet bills.service

          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi

            sleep 2
          done

          echo "La aplicación no respondió en el puerto 3000 después de 60 segundos"
          systemctl status bills.service --no-pager -l
          journalctl -u bills.service -n 80 --no-pager
          exit 1
          REMOTE

      - name: Notify deploy result
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$DEPLOY_STATUS" in
            success)
              title="✅ <b>Deploy exitoso</b>"
              ;;
            failure)
              title="❌ <b>Deploy fallido</b>"
              ;;
            cancelled)
              title="⛔ <b>Deploy cancelado</b>"
              ;;
            *)
              title="⚠️ <b>Deploy finalizado</b>"
              ;;
          esac

          message=$(printf '%s\n📦 <b>Repositorio:</b> %s\n🔗 <a href="%s">Ver ejecución en GitHub</a>' \
            "$title" "$GITHUB_REPOSITORY" "$RUN_URL")

          curl --fail --silent --show-error \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=$message" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"
